name: PodFlow CI

on:
  push:
    branches:
      - main
      - "restructure/**"
      - "feature/**"
      - "fix/**"

  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          test -f README.md
          test -f .gitignore
          test -f .env.example
          test -d docs
          test -d backend
          test -d frontend

      - name: Check for accidentally tracked secrets
        run: |
          if git ls-files | grep -E '(^|/)(\.env|\.env\..*|credentials\.json|.*-credentials\.json|.*\.pem|.*\.key)$'; then
            echo "Potential secret file detected in Git."
            exit 1
          fi