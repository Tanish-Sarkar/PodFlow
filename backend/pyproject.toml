[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "podflow-backend"
version = "0.1.0"
description = "PodFlow backend API and knowledge engine"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.52,<0.53",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.0.52,<2.1",
    "alembic>=1.20,<1.21",
    "psycopg[binary]>=3.3,<3.4",
    "pyjwt[crypto]>=2.8.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "httpx>=0.28,<0.29",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]
"src/podflow/api/**/*.py" = ["B008"]
"tests/**/*.py" = ["B008"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
